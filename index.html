<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Cita - Barbería Elite</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #d97706;
            --accent-hover: #b45309;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --info: #0284c7;
            --info-hover: #0369a1;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container { width: 100%; max-width: 650px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.2rem; color: var(--accent); margin: 0; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: var(--text-light); border-radius: 6px; box-sizing: border-box; font-size: 1rem; }

        /* ESTILOS DE GALERÍA DE SERVICIOS CON FOTO */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 10px; }
        .service-card {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .service-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .service-card.selected { border-color: var(--accent); background: rgba(217, 119, 6, 0.1); }
        .service-img { width: 100%; height: 140px; object-fit: cover; }
        .service-info { padding: 12px; }
        .service-title { font-weight: bold; font-size: 1rem; margin-bottom: 5px; }
        .service-meta { color: var(--accent); font-weight: 600; font-size: 0.95rem; }

        .grid-hours { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 10px; }
        .hour-btn { padding: 10px; background: #0f172a; border: 1px solid #334155; color: var(--text-light); border-radius: 6px; cursor: pointer; text-align: center; transition: 0.2s; }
        .hour-btn.selected { background: var(--accent); border-color: var(--accent); font-weight: bold; }
        
        .btn-submit { width: 100%; padding: 14px; background: var(--accent); border: none; color: white; font-size: 1.1rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: var(--accent-hover); }
        .btn-info { background: var(--info); }
        .btn-info:hover { background: var(--info-hover); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .button-group button { flex: 1; font-size: 0.95rem; padding: 12px; }

        /* Cambiar el icono del calendario a color claro/blanco */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1><i class="fa-solid fa-scissors"></i> Barbería Elite</h1>
        <p style="color: var(--text-muted)">Reserva tu cita en línea</p>
    </div>

    <!-- SECCIÓN 1: AGENDAR CITA -->
    <div class="card">
        <h2><i class="fa-solid fa-calendar-plus"></i> Agendar tu Cita</h2>

        <div class="form-group">
            <label>1. Selecciona el Servicio (Haz clic en una opción):</label>
            <div id="contenedorServicios" class="services-grid">Cargando catálogo con fotos...</div>
        </div>

        <div class="form-group">
            <label>2. Selecciona la Fecha:</label>
            <input type="date" id="fechaSelect" onchange="consultarDisponibilidad()">
        </div>

        <div class="form-group">
            <label>3. Horarios Disponibles:</label>
            <div id="contenedorHorarios" class="grid-hours">
                <small style="color: var(--text-muted)">Selecciona una fecha primero.</small>
            </div>
        </div>

        <div class="form-group">
            <label>4. Tus Datos de Contacto:</label>
            <input type="text" id="nombre" placeholder="Nombre Completo" style="margin-bottom: 10px;">
            <input type="email" id="email" placeholder="Correo Electrónico" style="margin-bottom: 10px;">
            <input type="tel" id="telefono" placeholder="Número de WhatsApp">
        </div>

        <button class="btn-submit" onclick="agendarCita()">CONFIRMAR RESERVACIÓN</button>
    </div>

    <!-- SECCIÓN 2: GESTIONAR CITA -->
    <div class="card">
        <h2><i class="fa-solid fa-calendar-check"></i> Consulta o Cancela tu Cita</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Ingresa tu número de teléfono registrado:</p>

        <div class="form-group">
            <input type="tel" id="gestionTelefono" placeholder="Ej. 3121234567">
        </div>

        <div class="button-group">
            <button class="btn-submit btn-info" onclick="consultarCitaCliente()">
                <i class="fa-solid fa-magnifying-glass"></i> Consultar Cita
            </button>
            <button class="btn-submit btn-danger" onclick="cancelarCitaCliente()">
                <i class="fa-solid fa-calendar-xmark"></i> Cancelar Cita
            </button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://chdiinrzmrpphwafwgbk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoZGlpbnJ6bXJwcGh3YWZ3Z2JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTQ1NDgsImV4cCI6MjEwNjE5MDU0OH0.88e2UxvOnA5H4CDyx4pN3wjOF_MXKWkO0AXlPREfVSE'; // 👈 Asegúrate de pegar tu clave anon public
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let servicioSeleccionadoId = null;
    let horaSeleccionada = null;

    function establecerFechaMinima() {
        const hoy = new Date();
        const año = hoy.getFullYear();
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const dia = String(hoy.getDate()).padStart(2, '0');
        document.getElementById('fechaSelect').min = `${año}-${mes}-${dia}`;
    }

    async function cargarServicios() {
        const { data: servicios } = await _supabase.from('servicios').select('*');
        const contenedor = document.getElementById('contenedorServicios');
        contenedor.innerHTML = '';

        if (servicios && servicios.length > 0) {
            servicios.forEach((s, index) => {
                const imgUrl = s.imagen_url || 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=600&q=80';
                
                const card = document.createElement('div');
                card.className = `service-card ${index === 0 ? 'selected' : ''}`;
                if (index === 0) servicioSeleccionadoId = s.id; // Seleccionar el primero por defecto

                card.innerHTML = `
                    <img src="${imgUrl}" alt="${s.nombre}" class="service-img">
                    <div class="service-info">
                        <div class="service-title">${s.nombre}</div>
                        <div class="service-meta">$${s.precio} MXN • ${s.duracion_minutos} min</div>
                    </div>
                `;

                card.onclick = () => {
                    document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    servicioSeleccionadoId = s.id;
                };

                contenedor.appendChild(card);
            });
        }
    }

    async function consultarDisponibilidad() {
        const fechaInput = document.getElementById('fechaSelect').value;
        const contenedor = document.getElementById('contenedorHorarios');
        if (!fechaInput) return;

        contenedor.innerHTML = 'Consultando disponibilidad...';
        horaSeleccionada = null;

        const { data: bloqueos } = await _supabase.from('bloqueos_agenda').select('*').eq('fecha', fechaInput);
        if (bloqueos && bloqueos.length > 0) {
            contenedor.innerHTML = `<span style="color:var(--danger); font-weight:bold;">⛔ Este día no hay servicio disponible.</span>`;
            return;
        }

        const fechaObjeto = new Date(fechaInput + 'T00:00:00');
        const diaSemana = fechaObjeto.getDay();
        const { data: horarioHabitual } = await _supabase.from('horarios_laborales').select('*').eq('dia_semana', diaSemana).single();
        if (horarioHabitual && !horarioHabitual.es_activo) {
            contenedor.innerHTML = `<span style="color:var(--danger); font-weight:bold;">⛔ Cerrado los días de descanso habitual.</span>`;
            return;
        }

        const { data: citas } = await _supabase.from('citas').select('hora').eq('fecha', fechaInput).eq('estado', 'CONFIRMADA');
        const horasOcupadas = citas ? citas.map(c => c.hora.slice(0, 5)) : [];
        const horariosBase = ["09:00", "10:00", "11:00", "12:00", "13:00", "15:00", "16:00", "17:00", "18:00", "19:00"];

        const ahora = new Date();
        const añoHoy = ahora.getFullYear();
        const mesHoy = String(ahora.getMonth() + 1).padStart(2, '0');
        const diaHoy = String(ahora.getDate()).padStart(2, '0');
        const fechaHoyTexto = `${añoHoy}-${mesHoy}-${diaHoy}`;

        const esHoy = (fechaInput === fechaHoyTexto);
        const horaActualEntera = ahora.getHours();
        const minutoActualEntero = ahora.getMinutes();

        contenedor.innerHTML = '';
        let horasDisponiblesContador = 0;

        horariosBase.forEach(h => {
            const [horaStr, minStr] = h.split(':');
            const horaNum = parseInt(horaStr, 10);
            const minNum = parseInt(minStr, 10);

            let yaPaso = false;
            if (esHoy) {
                if (horaNum < horaActualEntera) {
                    yaPaso = true;
                } else if (horaNum === horaActualEntera && minNum <= minutoActualEntero) {
                    yaPaso = true;
                }
            }

            if (yaPaso) return;

            horasDisponiblesContador++;

            const btn = document.createElement('div');
            const estaOcupado = horasOcupadas.includes(h);
            
            btn.className = `hour-btn ${estaOcupado ? 'disabled' : ''}`;
            btn.innerText = h;
            
            if (estaOcupado) {
                btn.style.opacity = '0.3';
                btn.style.cursor = 'not-allowed';
            } else {
                btn.onclick = () => {
                    document.querySelectorAll('.hour-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    horaSeleccionada = h;
                };
            }
            contenedor.appendChild(btn);
        });

        if (horasDisponiblesContador === 0) {
            contenedor.innerHTML = `<small style="color: var(--text-muted)">No quedan horarios disponibles para hoy.</small>`;
        }
    }

    async function agendarCita() {
        const fecha = document.getElementById('fechaSelect').value;
        const cliente_nombre = document.getElementById('nombre').value;
        const cliente_email = document.getElementById('email').value;
        const cliente_telefono = document.getElementById('telefono').value;

        if (!servicioSeleccionadoId || !fecha || !horaSeleccionada || !cliente_nombre || !cliente_telefono) {
            alert('Por favor selecciona un servicio, la fecha, la hora e ingresa tu nombre y teléfono.');
            return;
        }

        const { error } = await _supabase.from('citas').insert([
            { servicio_id: servicioSeleccionadoId, fecha, hora: horaSeleccionada, cliente_nombre, cliente_email, cliente_telefono }
        ]);

        if (error) {
            alert('Error al agendar la cita: ' + error.message);
        } else {
            alert('🎉 ¡Tu cita ha sido agendada con éxito!');
            location.reload();
        }
    }

    async function consultarCitaCliente() {
        const telefono = document.getElementById('gestionTelefono').value.trim();
        if (!telefono) { alert('Ingresa tu número de teléfono.'); return; }

        const { data: citas, error } = await _supabase
            .from('citas')
            .select('*, servicios(nombre, precio)')
            .eq('cliente_telefono', telefono)
            .eq('estado', 'CONFIRMADA');

        if (error || !citas || citas.length === 0) {
            alert('No se encontraron citas activas para este número.');
            return;
        }

        const cita = citas[0];
        const servicioNombre = cita.servicios ? cita.servicios.nombre : 'Servicio reservado';
        const servicioPrecio = cita.servicios ? `$${cita.servicios.precio} MXN` : '';

        alert(`📋 DETALLES DE TU RESERVACIÓN:\n\n👤 Cliente: ${cita.cliente_nombre}\n💈 Servicio: ${servicioNombre} (${servicioPrecio})\n📅 Fecha: ${cita.fecha}\n⏰ Hora: ${cita.hora.slice(0, 5)} hs\n📌 Estado: CONFIRMADA`);
    }

    async function cancelarCitaCliente() {
        const telefono = document.getElementById('gestionTelefono').value.trim();
        if (!telefono) { alert('Ingresa tu número de teléfono.'); return; }

        const { data: citas, error } = await _supabase
            .from('citas')
            .select('*')
            .eq('cliente_telefono', telefono)
            .eq('estado', 'CONFIRMADA');

        if (error || !citas || citas.length === 0) {
            alert('No se encontraron citas activas para cancelar con este número.');
            return;
        }

        const cita = citas[0];
        const confirmar = confirm(`Hola ${cita.cliente_nombre}, encontramos tu cita:\n\n📅 Fecha: ${cita.fecha}\n⏰ Hora: ${cita.hora.slice(0, 5)} hs\n\n¿Deseas cancelar esta cita?`);

        if (confirmar) {
            const { error: errUpdate } = await _supabase
                .from('citas')
                .update({ estado: 'CANCELADA_CLIENTE' })
                .eq('id', cita.id);

            if (!errUpdate) {
                alert('✅ Tu cita ha sido cancelada y la hora se ha liberado.');
                location.reload();
            } else {
                alert('Error al cancelar la cita: ' + errUpdate.message);
            }
        }
    }

    establecerFechaMinima();
    cargarServicios();
</script>

</body>
</html>
